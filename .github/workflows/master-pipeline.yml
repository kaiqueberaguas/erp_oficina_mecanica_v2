name: Master Pipeline

# Dispara no merge de PR na master (push na master).
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: master-pipeline
  cancel-in-progress: false

jobs:
  integracao-e2e:
    name: Docker + testes integrados (backend) + E2E
    runs-on: ubuntu-latest
    env:
      TEST_DB_CONNECTION: server=127.0.0.1;port=3306;database=oficina_mecanica;user=root;password=root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Subir MySQL (docker compose)
        run: docker compose up -d --wait mysql

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build backend
        working-directory: Backend
        run: dotnet build Erp_Oficina_Mecanica_v2.slnx --configuration Release

      - name: Testes integrados (backend)
        working-directory: Backend
        run: dotnet test Erp_Oficina_Mecanica_v2.slnx --configuration Release --no-build --filter "Category=Integration" --verbosity normal

      - name: Subir API (porta 5234)
        working-directory: Backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5234
        run: |
          nohup dotnet run --project WebApi --configuration Release --no-build --no-launch-profile > ../api.log 2>&1 &

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/erp-mecanica-frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend/erp-mecanica-frontend
        run: npm ci

      - name: Subir frontend (porta 4200)
        working-directory: frontend/erp-mecanica-frontend
        run: |
          nohup npm start -- --host 127.0.0.1 > ../../front.log 2>&1 &

      - name: Aguardar API e frontend
        run: |
          for url in http://127.0.0.1:5234/openapi/v1.json http://127.0.0.1:4200; do
            curl -sf -o /dev/null --retry 90 --retry-delay 2 --retry-all-errors --retry-connrefused "$url"               || { echo "Timeout aguardando $url"; exit 1; }
            echo "OK: $url"
          done

      - name: Testes E2E (Cypress)
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend/erp-mecanica-frontend
          install: false
          browser: chrome

      - name: Logs da API e do frontend (em caso de falha)
        if: failure()
        run: |
          echo "=== api.log ==="; cat api.log || true
          echo "=== front.log ==="; cat front.log || true

      - name: Derrubar containers
        if: always()
        run: docker compose down -v
