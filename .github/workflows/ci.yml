name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Lint (.NET format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verificar formatação
        working-directory: Backend
        run: dotnet format Erp_Oficina_Mecanica_v2.slnx --verify-no-changes

  lint-frontend:
    name: Lint (Prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/erp-mecanica-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/erp-mecanica-frontend/package-lock.json
      - run: npm ci
      - name: Verificar formatação
        run: npm run lint

  testes-backend:
    name: Backend (build + testes unitários e integrados)
    runs-on: ubuntu-latest
    env:
      TEST_DB_CONNECTION: server=127.0.0.1;port=3306;database=oficina_mecanica;user=root;password=root
    steps:
      - uses: actions/checkout@v4
      - name: Subir MySQL (docker compose)
        run: docker compose up -d --wait mysql
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        working-directory: Backend
        run: dotnet build Erp_Oficina_Mecanica_v2.slnx --configuration Release
      - name: Testes
        working-directory: Backend
        run: dotnet test Erp_Oficina_Mecanica_v2.slnx --configuration Release --no-build --verbosity normal
      - name: Derrubar containers
        if: always()
        run: docker compose down -v

  testes-frontend:
    name: Frontend (testes + cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/erp-mecanica-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/erp-mecanica-frontend/package-lock.json
      - run: npm ci
      - run: npm run test:cov

  docker-build:
    name: Build das imagens Docker
    needs: [lint-backend, lint-frontend, testes-backend, testes-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Imagem do backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/WebApi/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/erp-mecanica-frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Validar docker compose
        run: docker compose build
